name: Backend tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run synthetic backend test harness
        run: python -I -B tools/local-test/guard.py
