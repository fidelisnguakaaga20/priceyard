name: Backend tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run synthetic backend test harness
        run: python -I -B tools/local-test/guard.py

  deploy-backend:
    name: Deploy backend (only if tests passed)
    needs: guard
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK secret not set - skipping deploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

      - name: Wait for the new commit to go live
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        if: env.HOOK != ''
        run: |
          echo "Waiting for https://priceyard-api.onrender.com/health to report ${{ github.sha }}"
          for i in $(seq 1 60); do
            body="$(curl -fsS https://priceyard-api.onrender.com/health || true)"
            echo "attempt $i: $body"
            if echo "$body" | grep -q "${{ github.sha }}"; then
              echo "Confirmed live."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Backend did not report the new commit as deployed within 15 minutes."
          exit 1

  frontend-build:
    name: Website build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install website dependencies
        working-directory: frontend
        run: npm ci

      - name: Build website (type check and bundle)
        working-directory: frontend
        run: npm run build

  deploy-frontend:
    name: Deploy frontend (only if tests and build passed)
    needs: [guard, frontend-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_FRONTEND_DEPLOY_HOOK secret not set - skipping deploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
